name: Bug report
description: Something behaves differently from the README
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact terminal text that triggered it if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "npx freebuff-autocontinue --version"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [npx, npm global, curl installer, Homebrew, GitHub Packages, other]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15 / Ubuntu 24.04 / WSL2"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log output
      description: Paste from freebuff-autocontinue.log if you have it.
      render: shell
